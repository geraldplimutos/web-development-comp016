<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bento Image Gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous">
  <style>
    .card {
      min-height: 100px;
      background-color: gray;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white; 
    }
  </style>
</head>

<body>
  <div class="container-fluid p-3">
    <!-- Top Row: Asymmetrical Grid -->
    <div class="row">
      <div class="col-4 p-1">
        <div class="card p-1 h-100">
          picture 1
        </div>
      </div>
      <div class="col-8">
        <div class="row">
          <div class="col-12 p-1">
            <div class="card p-1">
              picture 2
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-6 p-1">
            <div class="card p-1">
              picture 3
            </div>
          </div>
          <div class="col-6 p-1">
            <div class="card p-1">
              picture 4
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Bottom Row: Symmetrical Blocks -->
    <div class="row">
      <div class="col-3 p-1">
        <div class="card p-1">
          picture 5
        </div>
      </div>
      <div class="col-6 p-1">
        <div class="card p-1">
          picture 6
        </div>
      </div>
      <div class="col-3 p-1">
        <div class="card p-1">
          picture 7
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
</body>

</html>
