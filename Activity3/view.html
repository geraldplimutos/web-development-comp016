<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attack on Titan Dex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="styles.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>

<body>
  <div class="container-fluid aot-header mb-3">
    <div class="row">
      <div class="col">
        <div class="text-center py-3">
          <a href="index.html?page=1">
            <img src="assets/logo.png" alt="Attack on Titan Dex" style="height: 120px;">
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col px-5 my-3">
        <a href="index.html" id="backlink">
          <div class="btn aot-btn">Back to list</div>
        </a>
      </div>
    </div>
    <div class="row">
      <div class="col px-5">
        <div class="card p-5 text-center rounded-3 aot-card">
          <div class="mx-auto rounded-circle overflow-hidden" style="background-color: grey; width: 300px; height: 300px; overflow: hidden;"
            id="imgContainer">
            <img id="image" style="width: 300px; height: 300px; object-fit: cover;" class="mx-auto"
              onerror="this.onerror=null; this.src='assets/logo.png'; this.style.objectFit='contain'; this.style.padding='30px';">
          </div>
          <div class="h3 mt-4 display-5" id="name">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
          <div>
            <span class="badge rounded-pill text-black" id="species"></span>
          </div>
          <div class="mt-4 text-start" id="details"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    const colors = {
      human: '#DEFDE0',
      horse: '#F4E7DA',
      titan: '#FDDFDF',
      'intelligent titan': '#FCF7DE',
      'titan (formerly human)': '#EAEDA1',
      unknown: '#E8E8E8',
    };

    const defaultColor = '#F5F5F5';

    // turn a value into text: arrays become a comma separated list, empty values become a dash
    function joinOrDash(value) {
      if (Array.isArray(value)) {
        return value.length > 0 ? value.join(', ') : '—';
      }
      return value || '—';
    }

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    const id = urlParams.get('id');
    var page = urlParams.get('page');
    page = page == null ? 1 : page;

    var elName = document.getElementById("name");
    var elImage = document.getElementById("image");
    var elSpecies = document.getElementById("species");
    var elImgContainer = document.getElementById("imgContainer");
    var elBacklink = document.getElementById("backlink");
    var elDetails = document.getElementById("details");

    elBacklink.href = "index.html?page=" + page;

    const getCharacter = async (id) => {
      const response = await fetch('https://api.attackontitanapi.com/characters/' + id);
      const character = await response.json();

      var species = character.species[0];
      var color = colors[species.toLowerCase()] || defaultColor;

      elName.innerHTML = character.name;
      elSpecies.innerHTML = joinOrDash(character.species);
      elSpecies.style.backgroundColor = color;
      elImgContainer.style.backgroundColor = color;
      if (character.img) {
        elImage.style.objectFit = 'cover';
        elImage.style.padding = '0';
        elImage.src = character.img;
      } else {
        elImage.src = 'assets/logo.png';
        elImage.style.objectFit = 'contain';
        elImage.style.padding = '30px';
      }

      var groups = character.groups && character.groups.length > 0
        ? character.groups.map(function (group) { return group.name; }).join(', ')
        : '—';

      var relatives = character.relatives && character.relatives.length > 0
        ? character.relatives.map(function (relative) { return relative.family; }).join(', ')
        : '—';

      elDetails.innerHTML = `
        <div class="aot-stats">
          <div class="aot-stat"><span class="aot-stat-label">Alias</span><span class="aot-stat-value">` + joinOrDash(character.alias) + `</span></div>
          <div class="aot-stat"><span class="aot-stat-label">Species</span><span class="aot-stat-value">` + joinOrDash(character.species) + `</span></div>
          <div class="aot-stat"><span class="aot-stat-label">Status</span><span class="aot-stat-value">` + joinOrDash(character.status) + `</span></div>
          <div class="aot-stat"><span class="aot-stat-label">Gender</span><span class="aot-stat-value">` + joinOrDash(character.gender) + `</span></div>
          <div class="aot-stat"><span class="aot-stat-label">Age</span><span class="aot-stat-value">` + joinOrDash(character.age) + `</span></div>
          <div class="aot-stat"><span class="aot-stat-label">Height</span><span class="aot-stat-value">` + joinOrDash(character.height) + `</span></div>
          <div class="aot-stat"><span class="aot-stat-label">Occupation</span><span class="aot-stat-value">` + joinOrDash(character.occupation) + `</span></div>
          <div class="aot-stat"><span class="aot-stat-label">Birthplace</span><span class="aot-stat-value">` + joinOrDash(character.birthplace) + `</span></div>
          <div class="aot-stat"><span class="aot-stat-label">Residence</span><span class="aot-stat-value">` + joinOrDash(character.residence) + `</span></div>
          <div class="aot-stat"><span class="aot-stat-label">Roles</span><span class="aot-stat-value">` + joinOrDash(character.roles) + `</span></div>
          <div class="aot-stat"><span class="aot-stat-label">Groups</span><span class="aot-stat-value">` + groups + `</span></div>
          <div class="aot-stat"><span class="aot-stat-label">Relatives</span><span class="aot-stat-value">` + relatives + `</span></div>
        </div>
      `;
    }

    if (id != null) {
      getCharacter(id);
    }
  </script>
</body>

</html>
