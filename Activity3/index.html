<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attack on Titan Dex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    :root {
      color-scheme: dark;
      --aot-green: #2b3a2a;
      --aot-green-light: #3d5039;
      --aot-bg: #121212;
      --aot-surface: #1e1e1e;
      --aot-card: #242424;
      --aot-parchment: #f4efe6;
      --aot-tan: #c8b48a;
      --aot-text: #e6e3dc;
      --aot-muted: #9a998f;
      --aot-border: #3a3a3a;
    }

    body {
      background-color: var(--aot-bg);
      color: var(--aot-text);
    }

    /* header */
    .aot-header {
      background: linear-gradient(180deg, #33452f 0%, var(--aot-green) 100%);
      border-bottom: 3px solid var(--aot-tan);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .65);
    }

    /* character cards */
    .aot-card {
      background-color: var(--aot-card);
      border: 1px solid var(--aot-border);
      border-left: 4px solid var(--aot-green-light);
      color: var(--aot-text);
      transition: background-color .15s ease, border-color .15s ease, transform .15s ease;
    }

    .aot-card:hover {
      background-color: #2c2c2c;
      border-left-color: var(--aot-tan);
      transform: translateX(4px);
    }

    .aot-name {
      color: var(--aot-parchment);
      text-decoration: none;
      letter-spacing: .02em;
    }

    .aot-name:hover {
      color: var(--aot-tan);
    }

    .aot-muted {
      color: var(--aot-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    /* species / affiliation badges */
    .aot-pill {
      color: #1a1a1a;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      border: 1px solid rgba(0, 0, 0, .25);
    }

    /* pagination + page selector */
    .aot-pagination .page-link {
      background-color: var(--aot-surface);
      border-color: var(--aot-border);
      color: var(--aot-text);
    }

    .aot-pagination .page-link:hover {
      background-color: var(--aot-green-light);
      border-color: var(--aot-tan);
      color: var(--aot-parchment);
    }

    #currentPage {
      background-color: var(--aot-green);
      border-color: var(--aot-tan);
      color: var(--aot-parchment);
    }

    #pageSelect {
      background-color: var(--aot-surface);
      border: 1px solid var(--aot-border);
      color: var(--aot-text);
    }

    #pageSelect:focus {
      border-color: var(--aot-tan);
      box-shadow: 0 0 0 .2rem rgba(200, 180, 138, .25);
    }
  </style>
</head>

<body>
  <div class="container-fluid aot-header mb-3">
    <div class="row">
      <div class="col">
        <div class="text-center py-3">
          <a href="index.html?page=1">
            <img src="assets/logo.png" alt="Attack on Titan Dex" style="height: 120px;">
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <nav aria-label="Page navigation example" class="d-flex align-items-center">
      <ul class="pagination aot-pagination mb-0 me-2">
        <li class="page-item"><a class="page-link" onclick="prev()">Previous</a></li>
        <li class="page-item"><a class="page-link" id="currentPage">1</a></li>
        <li class="page-item"><a class="page-link" onclick="next()">Next</a></li>
      </ul>
      <select class="form-select w-auto" id="pageSelect" aria-label="Jump to page"></select>
    </nav>
  </div>

  <div class="container">
    <div class="row" id="parent">

    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    const colors = {
      human: '#DEFDE0',
      horse: '#F4E7DA',
      titan: '#FDDFDF',
      'intelligent titan': '#FCF7DE',
      'titan (formerly human)': '#EAEDA1',
      unknown: '#E8E8E8',
    };

    const defaultColor = '#F5F5F5';

    function capitalizeFirstLetter(str) {
      if (!str) return str;
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    var page = urlParams.get('page');

    page = page == null ? 1 : parseInt(page);

    var perPageLoad = 10;        // characters shown per UI page (API returns 20 per page)
    var totalCharacters = 201;   // total characters in the API
    var lastPage = Math.ceil(totalCharacters / perPageLoad);

    var elParent = document.getElementById("parent");
    var elCurrentPage = document.getElementById("currentPage");
    var elPageSelect = document.getElementById("pageSelect");

    // fill the dropdown with every page, from 1 to lastPage
    for (var i = 1; i <= lastPage; i++) {
      elPageSelect.innerHTML += '<option value="' + i + '">' + i + '</option>';
    }
    elPageSelect.value = page;

    elPageSelect.onchange = function () {
      page = parseInt(elPageSelect.value);
      getCharacters();
    };

    const getCharacters = async () => {
      elParent.innerHTML = '';
      elCurrentPage.innerHTML = page;
      elPageSelect.value = page;

      // two UI pages share one API page
      var apiPage = Math.ceil(page / 2);
      var response = await fetch('https://api.attackontitanapi.com/characters?page=' + apiPage);
      var data = await response.json();

      // odd UI page -> first 10 results, even UI page -> last 10 results
      var start = page % 2 === 1 ? 0 : perPageLoad;
      var characters = data.results.slice(start, start + perPageLoad);

      characters.forEach(function (character) {
        var id = character.id;
        var name = character.name;
        var picture = character.img;
        var species = capitalizeFirstLetter(character.species[0]);
        var affiliation = character.groups.length > 0 ? character.groups[0].name : '';
        var color = colors[character.species[0].toLowerCase()] || defaultColor;
        var imageTag = picture ? '<img class="w-100" src="' + picture + '">' : '';

        elParent.innerHTML += `
          <div class="col-12">
            <div class="card my-3 p-4 d-flex flex-row align-items-center aot-card">
              <div class="rounded-circle overflow-hidden" style="width: 60px; height: 60px; background-color: ` + color + `;">
                ` + imageTag + `
              </div>
              <div class="mx-4 h4">
                <a class="aot-name" href="view.html?id=`+ id +`&page=`+ page +`"> #` + id + " " + name + ` </a>
              </div>
              <div class="d-flex align-items-center ms-auto">
                <div class="small me-3 aot-muted">` + affiliation + `</div>
                <div class="rounded-pill px-4 py-1 aot-pill" style="background-color: ` + color + `">` + species + `</div>
              </div>
            </div>
          </div>
        `;
      });
    }

    function prev() {
      page -= 1;
      if (page == 0) {
        page = lastPage;
      }
      getCharacters();
    }

    function next() {
      page += 1;
      if (page > lastPage) {
        page = 1;
      }
      getCharacters();
    }

    getCharacters();
  </script>
</body>

</html>
