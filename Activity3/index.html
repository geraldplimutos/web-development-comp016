<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attack on Titan Dex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="styles.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>

<body>
  <div class="container-fluid aot-header mb-3">
    <div class="row">
      <div class="col">
        <div class="text-center py-3">
          <a href="index.html?page=1">
            <img src="assets/logo.png" alt="Attack on Titan Dex" style="height: 120px;">
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="container mb-3">
    <nav aria-label="Page navigation example" class="d-flex align-items-center flex-wrap">
      <ul class="pagination aot-pagination mb-0 me-2">
        <li class="page-item"><a class="page-link" onclick="prev()">Previous</a></li>
        <li class="page-item"><a class="page-link" id="currentPage">1</a></li>
        <li class="page-item"><a class="page-link" onclick="next()">Next</a></li>
      </ul>
      <select class="form-select w-auto" id="pageSelect" aria-label="Jump to page"></select>
      <input class="form-control ms-2" type="search" id="searchInput" placeholder="Search characters..."
        aria-label="Search characters by name">
      <button class="btn aot-btn ms-2 my-1" type="button" id="filterToggle" data-bs-toggle="collapse"
        data-bs-target="#filterPanel" aria-expanded="false" aria-controls="filterPanel">Filter &amp; Sort</button>
    </nav>

    <div class="collapse mt-3" id="filterPanel">
      <div class="aot-filter-panel p-3">
        <div class="row g-3">
          <div class="col-6 col-md-3">
            <label class="form-label aot-label" for="filterGender">Gender</label>
            <select class="form-select" id="filterGender">
              <option value="">All</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label aot-label" for="filterStatus">Status</label>
            <select class="form-select" id="filterStatus">
              <option value="">All</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label aot-label" for="filterSpecies">Species</label>
            <select class="form-select" id="filterSpecies">
              <option value="">All</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label aot-label" for="sortBy">Sort by</label>
            <select class="form-select" id="sortBy">
              <option value="id">ID</option>
              <option value="name-asc">Alphabetical A-Z</option>
              <option value="name-desc">Alphabetical Z-A</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="aot-grid" id="parent">

    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    const colors = {
      human: '#DEFDE0',
      horse: '#F4E7DA',
      titan: '#FDDFDF',
      'intelligent titan': '#FCF7DE',
      'titan (formerly human)': '#EAEDA1',
      unknown: '#E8E8E8',
    };

    const defaultColor = '#F5F5F5';
    const apiUrl = 'https://api.attackontitanapi.com/characters';

    function capitalizeFirstLetter(str) {
      if (!str) return str;
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    var page = urlParams.get('page');

    page = page == null ? 1 : parseInt(page);

    var searchQuery = urlParams.get('search') || '';
    var genderQuery = urlParams.get('gender') || '';
    var statusQuery = urlParams.get('status') || '';
    var speciesQuery = urlParams.get('species') || '';
    var sortQuery = urlParams.get('sort');
    if (sortQuery !== 'name-asc' && sortQuery !== 'name-desc') {
      sortQuery = 'id';
    }

    var perPageLoad = 10;      // characters shown per UI page
    var allCharacters = [];    // every character, loaded once
    var lastPage = 1;          // pages for the current filtered list

    var elParent = document.getElementById("parent");
    var elCurrentPage = document.getElementById("currentPage");
    var elPageSelect = document.getElementById("pageSelect");
    var elSearchInput = document.getElementById("searchInput");
    var elFilterGender = document.getElementById("filterGender");
    var elFilterStatus = document.getElementById("filterStatus");
    var elFilterSpecies = document.getElementById("filterSpecies");
    var elSortBy = document.getElementById("sortBy");

    // put the search, filters and sort from the URL back into the controls
    function applyURLParams() {
      elSearchInput.value = searchQuery;
      elFilterGender.value = genderQuery;
      elFilterStatus.value = statusQuery;
      elFilterSpecies.value = speciesQuery;
      elSortBy.value = sortQuery;
    }

    // write the current page, search, filters and sort into the address bar
    function updateURL(replace) {
      var params = new URLSearchParams();
      params.set('page', page);
      if (elSearchInput.value) params.set('search', elSearchInput.value);
      if (elFilterGender.value) params.set('gender', elFilterGender.value);
      if (elFilterStatus.value) params.set('status', elFilterStatus.value);
      if (elFilterSpecies.value) params.set('species', elFilterSpecies.value);
      if (elSortBy.value !== 'id') params.set('sort', elSortBy.value);

      var url = 'index.html?' + params.toString();
      if (replace) {
        history.replaceState(null, '', url);
      } else {
        history.pushState(null, '', url);
      }
    }

    // apply the selected filters and sort to the full list
    function getVisibleCharacters() {
      var search = elSearchInput.value.toLowerCase();

      var list = allCharacters.filter(function (character) {
        var nameOk = character.name.toLowerCase().includes(search);
        var genderOk = elFilterGender.value === '' || character.gender === elFilterGender.value;
        var statusOk = elFilterStatus.value === '' || character.status === elFilterStatus.value;
        var speciesOk = elFilterSpecies.value === '' || character.species.indexOf(elFilterSpecies.value) > -1;
        return nameOk && genderOk && statusOk && speciesOk;
      });

      if (elSortBy.value === 'name-asc') {
        list.sort(function (a, b) { return a.name.localeCompare(b.name); });
      } else if (elSortBy.value === 'name-desc') {
        list.sort(function (a, b) { return b.name.localeCompare(a.name); });
      } else {
        list.sort(function (a, b) { return a.id - b.id; });
      }

      return list;
    }

    // fill a filter dropdown with "All" + every unique value found in the data
    function fillFilter(elSelect, values) {
      elSelect.innerHTML = '<option value="">All</option>';
      values.forEach(function (value) {
        elSelect.innerHTML += '<option value="' + value + '">' + capitalizeFirstLetter(value) + '</option>';
      });
    }

    function uniqueValues(field) {
      var values = [];
      allCharacters.forEach(function (character) {
        if (character[field] && values.indexOf(character[field]) === -1) {
          values.push(character[field]);
        }
      });
      return values.sort();
    }

    function uniqueSpecies() {
      var values = [];
      allCharacters.forEach(function (character) {
        character.species.forEach(function (species) {
          if (values.indexOf(species) === -1) {
            values.push(species);
          }
        });
      });
      return values.sort();
    }

    function buildPageSelector() {
      elPageSelect.innerHTML = '';
      for (var i = 1; i <= lastPage; i++) {
        elPageSelect.innerHTML += '<option value="' + i + '">' + i + '</option>';
      }
      elPageSelect.value = page;
    }

    function getCharacters() {
      var characters = getVisibleCharacters();
      lastPage = Math.ceil(characters.length / perPageLoad) || 1;

      if (page > lastPage) page = lastPage;
      if (page < 1) page = 1;

      elCurrentPage.innerHTML = page;
      buildPageSelector();

      elParent.innerHTML = '';
      characters.slice((page - 1) * perPageLoad, page * perPageLoad).forEach(function (character) {
        var id = character.id;
        var name = character.name;
        var picture = character.img;
        var species = capitalizeFirstLetter(character.species[0]);
        var affiliation = character.groups.length > 0 ? character.groups[0].name : '—';
        var color = colors[character.species[0].toLowerCase()] || defaultColor;
        var imageTag = picture ? '<img src="' + picture + '" alt="' + name + '">' : '';
        var link = 'view.html?id=' + id + '&page=' + page;

        elParent.innerHTML += `
          <div class="card aot-card aot-tcg-card">
            <a class="aot-tcg-image" href="` + link + `" style="background-color: ` + color + `;">
              ` + imageTag + `
            </a>
            <div class="aot-tcg-id">#` + id + `</div>
            <div class="rounded-pill aot-pill aot-tcg-species" style="background-color: ` + color + `">` + species + `</div>
            <div class="aot-tcg-plate">
              <a class="aot-name aot-tcg-name" href="` + link + `">` + name + `</a>
              <div class="aot-tcg-info">` + affiliation + `</div>
            </div>
          </div>
        `;
      });
    }

    // load the whole dataset once (the API caps at 20 per page)
    const loadCharacters = async () => {
      var first = await (await fetch(apiUrl + '?page=1')).json();
      allCharacters = first.results;

      var requests = [];
      for (var p = 2; p <= first.info.pages; p++) {
        requests.push(fetch(apiUrl + '?page=' + p).then(function (response) { return response.json(); }));
      }
      var rest = await Promise.all(requests);
      rest.forEach(function (data) { allCharacters = allCharacters.concat(data.results); });

      fillFilter(elFilterGender, uniqueValues('gender'));
      fillFilter(elFilterStatus, uniqueValues('status'));
      fillFilter(elFilterSpecies, uniqueSpecies());

      applyURLParams();
      getCharacters();
    };

    function applyFilter() {
      page = 1;
      getCharacters();
      updateURL(true);
    }

    elPageSelect.onchange = function () {
      page = parseInt(elPageSelect.value);
      getCharacters();
      updateURL();
    };

    elSearchInput.oninput = applyFilter;
    elFilterGender.onchange = applyFilter;
    elFilterStatus.onchange = applyFilter;
    elFilterSpecies.onchange = applyFilter;
    elSortBy.onchange = applyFilter;

    function prev() {
      page -= 1;
      if (page == 0) {
        page = lastPage;
      }
      getCharacters();
      updateURL();
    }

    function next() {
      page += 1;
      if (page > lastPage) {
        page = 1;
      }
      getCharacters();
      updateURL();
    }

    loadCharacters();
  </script>
</body>

</html>
